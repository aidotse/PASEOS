# This workflow installs PASEOS with uv, runs a severe-error lint gate, and runs the test suite.
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions
name: Running tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # uv's standalone Python bundles tkinter, so headless matplotlib would pick an
    # interactive backend and the visualization test's plt.show() would block.
    env:
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"
    permissions:
      pull-requests: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # pykep 2.6 (the 2.x API PASEOS uses) only ships pip wheels up to Python 3.8.
      # conda users can run newer Python via environment.yml instead.
      - name: Set up Python 3.8
        run: uv python install 3.8
      - name: Search for severe code errors with ruff
        run: uvx ruff check . --select=E9,F63,F7,F82 --output-format=full
      - name: Install PASEOS with dev dependencies
        run: |
          uv venv --python 3.8
          uv pip install -e ".[dev]"
      - name: Test with pytest
        # --no-sync so `uv run` uses the venv populated above instead of
        # re-resolving (which would try to build pykep's broken sklearn shim).
        run: |
          set -e
          set -o pipefail
          uv run --no-sync pytest -v --timeout=180 --junitxml=pytest.xml --cov-report=xml:coverage.xml --cov-report=term-missing:skip-covered --cov=paseos paseos/tests/ | tee pytest-coverage.txt
      - name: Pytest coverage comment
        uses: MishaKav/pytest-coverage-comment@main
        # Fork PRs get a read-only GITHUB_TOKEN no matter what `permissions` asks
        # for, so posting the comment fails and marks the whole job red on green
        # tests. Skip it there rather than switching to pull_request_target,
        # which would run fork code with a writable token.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        with:
          pytest-coverage-path: ./pytest-coverage.txt
          pytest-xml-coverage-path: ./coverage.xml
          title: Coverage Report
          badge-title: Overall Coverage
          hide-badge: false
          hide-report: false
          create-new-comment: false
          hide-comment: false
          report-only-changed-files: false
          junitxml-path: ./pytest.xml

  # The pip job is pinned to Python 3.8 by pykep's wheels, but that is exactly the
  # version where asyncio.get_event_loop() still papers over a missing loop, so the
  # 3.10+ path would otherwise go untested. conda gets us a modern Python and
  # doubles as a check that environment.yml still solves.
  build-conda:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up conda environment from environment.yml
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: paseos
          miniforge-version: latest
      - name: Report resolved versions
        shell: bash -el {0}
        run: python -c "import sys, pykep, numpy; print(sys.version); print(pykep.__version__, numpy.__version__)"
      - name: Test with pytest
        shell: bash -el {0}
        run: pytest -v --timeout=180 paseos/tests/
